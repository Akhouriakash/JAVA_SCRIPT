<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur Code</title>
</head>
<body style="background-color: #212121 ; color:#fff; ">
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random()*10+1)
    div.setAttribute("title", "generated title")  // imp : it will directly set the value 
    div.style.backgroundColor = "green"
    div.style.padding = "12px";
    // div.innerText = "Chai aur code" // but in others it will override the value ,purane value  phle leke ata h value phir usme set krta h 

    const addText = document.createTextNode("Chai aur Code") // khudka node create kr raha hum
    div.appendChild(addText)

    document.body.appendChild(div)

</script>
</html>
